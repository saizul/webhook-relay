name: Bug report
description: webhook-relay crashed, rejected a valid webhook or did not deliver as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real secrets, API tokens or customer payloads.** Replace them with placeholders.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The request you sent (headers without secrets), the response and the relevant log lines.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config (redacted)
      description: The route and target section of your config.yaml.
      render: yaml
  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of: webhook-relay --version (or the image tag)"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Docker image on Debian 12 behind Caddy / pip install on Python 3.12"
