name: Feature request
description: Suggest an improvement to delivery, storage, the API or the CLI
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Config keys, endpoints or CLI flags you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
