[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-relay"
dynamic = ["version"]
description = "Self-hosted webhook inbox and relay: verify GitHub, Stripe, Shopify, Slack and HMAC signatures, store every delivery in SQLite and fan out to your services with retries, a dead-letter list and replay."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saizul Amin" }]
keywords = ["webhooks", "webhook-relay", "self-hosted", "hmac", "signature-verification", "github", "stripe", "shopify", "slack", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=0.37,<2",
    "httpx>=0.27,<1",
    "uvicorn>=0.29,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saizul/webhook-relay"
Issues = "https://github.com/saizul/webhook-relay/issues"
Changelog = "https://github.com/saizul/webhook-relay/blob/main/CHANGELOG.md"

[project.scripts]
webhook-relay = "webhook_relay.cli:main"

[tool.setuptools.dynamic]
version = { attr = "webhook_relay._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webhook_relay = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette >= 1.x prefers httpx2 for its TestClient; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
